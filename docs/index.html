<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gold &amp; Silver · India</title>
<meta name="theme-color" content="#14110c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --bg:#14110c; --panel:#1d1912; --panel2:#262017; --line:#3a3226;
    --text:#f4ede0; --muted:#a59a87; --gold:#e3b54a; --gold2:#b8862b;
    --silver:#c9ced6; --down:#ff6b5e; --up:#5fd38d;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  main{max-width:520px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px 40px}
  header{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 2px 16px}
  h1{font-size:22px;margin:0;letter-spacing:-.3px}
  h1 span{color:var(--gold)}
  .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .refresh{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);
    display:grid;place-items:center}
  .refresh svg{width:18px;height:18px;stroke:var(--muted)}
  .refresh.spin svg{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
  .seg button{flex:1;padding:7px 10px;border-radius:9px;color:var(--muted);font-size:13px;font-weight:600}
  .seg button.on{background:var(--panel2);color:var(--text);box-shadow:0 1px 0 #0006}

  .cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);
    border-radius:var(--r);padding:14px 14px 12px;position:relative;overflow:hidden}
  .card.wide{grid-column:1/-1}
  .card .lab{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted);font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%}
  .card .px{font-size:26px;font-weight:700;letter-spacing:-.5px;margin:6px 0 2px;font-variant-numeric:tabular-nums}
  .card.wide .px{font-size:32px}
  .card:not(.wide) .px{font-size:21px}
  .card:not(.wide) .badge{display:none}
  .card .unit{font-size:13px;color:var(--muted);font-weight:500}
  .chg{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
  .chg.down{color:var(--down)} .chg.up{color:var(--up)} .chg.flat{color:var(--muted)}
  .meta{font-size:11.5px;color:var(--muted);margin-top:6px}
  .badge{position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:700;letter-spacing:.5px;
    padding:3px 7px;border-radius:99px;background:#0004;color:var(--muted);text-transform:uppercase}
  .badge.live{color:var(--up)}

  section.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:12px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .panel h2{font-size:14px;margin:0;color:var(--muted);font-weight:700;letter-spacing:.2px}
  .ranges{display:flex;gap:4px;margin-top:10px}
  .ranges button{flex:1;padding:6px 0;border-radius:8px;font-size:12px;font-weight:700;color:var(--muted)}
  .ranges button.on{background:var(--panel2);color:var(--text)}
  .chart{position:relative;margin-top:8px;touch-action:pan-y}
  .chart svg{display:block;width:100%;height:210px}
  .tip{position:absolute;top:0;pointer-events:none;background:#000c;border:1px solid var(--line);
    padding:5px 8px;border-radius:8px;font-size:12px;white-space:nowrap;transform:translateX(-50%);display:none}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .stat{background:var(--panel2);border-radius:12px;padding:9px 10px}
  .stat b{display:block;font-size:14px;font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--muted)}
  .empty{color:var(--muted);font-size:13px;padding:30px 6px;text-align:center}

  ul.alerts{list-style:none;margin:10px 0 0;padding:0}
  ul.alerts li{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
  ul.alerts li:first-child{border-top:0}
  ul.alerts .d{color:var(--muted);font-size:12px;min-width:70px;font-variant-numeric:tabular-nums}
  .rules{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.6}
  .rules b{color:var(--text);font-weight:600}
  footer{color:var(--muted);font-size:11.5px;text-align:center;margin-top:18px;line-height:1.5}
  #install{display:none;width:100%;margin-top:12px;padding:12px;border-radius:12px;
    background:var(--gold);color:#1b1408;font-weight:700}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Gold <span>&amp;</span> Silver · India</h1>
      <div class="sub" id="updated">Loading…</div>
    </div>
    <button class="refresh" id="refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
    </button>
  </header>

  <div class="seg" id="mode">
    <button data-mode="india" class="on">India (incl. duty)</button>
    <button data-mode="spot">International spot</button>
  </div>

  <div class="cards" id="cards"></div>

  <section class="panel">
    <div class="row">
      <h2>Trend</h2>
      <div class="seg" id="metal" style="padding:2px">
        <button data-metal="gold" class="on">Gold</button>
        <button data-metal="silver">Silver</button>
      </div>
    </div>
    <div class="ranges" id="ranges">
      <button data-d="0" class="on">Today</button><button data-d="30">1M</button><button data-d="90">3M</button>
      <button data-d="180">6M</button><button data-d="365">1Y</button><button data-d="9999">All</button>
    </div>
    <div class="chart" id="chart"><div class="tip" id="tip"></div></div>
    <div class="stats" id="stats"></div>
  </section>

  <section class="panel">
    <h2>Recent alerts</h2>
    <ul class="alerts" id="alerts"></ul>
    <div class="rules" id="rules"></div>
  </section>

  <button id="install">Install as app</button>

  <footer>
    India rate = international spot × import duty<span id="gstnote"></span>.<br>
    Jewellers' rates add making charges and local premiums; % moves track closely.<br>
    Live prices: <a href="https://xaus.com" style="color:inherit">xaus.com</a> (indicative, refreshed every minute).
  </footer>
</main>

<script>
const OZ = 31.1034768, P22 = 0.916;
const API = [
  m => `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/${m}.min.json`,
  m => `https://latest.currency-api.pages.dev/v1/currencies/${m}.min.json`,
];
const state = { cfg: {}, hist: [], live: null, mode: 'india', metal: 'gold', days: 0, ticks: [] };
const $ = id => document.getElementById(id);
const fmt = n => n == null || isNaN(n) ? '–' : '₹' + Math.round(n).toLocaleString('en-IN');
const short = n => n >= 1e5 ? '₹' + (n/1e5).toFixed(2) + 'L' : '₹' + Math.round(n/1000) + 'k';

function factor(){
  const c = state.cfg, duty = 1 + (c.import_duty_pct||0)/100;
  return duty * (c.include_gst ? 1 + (c.gst_pct||0)/100 : 1);
}
// Value for a metal from a history row, honouring the India/spot toggle
function val(row, key){
  if (!row) return null;
  if (state.mode === 'india') return row[key];
  if (key === 'gold_24k_10g') return row.gold_spot_10g;
  if (key === 'gold_22k_10g') return row.gold_spot_10g * P22;
  if (key === 'silver_1kg')   return row.silver_spot_kg;
}

async function getJSON(url){
  const r = await fetch(url, {cache:'no-store'});
  if (!r.ok) throw new Error(r.status);
  return r.json();
}
const todayIST = () => new Date(Date.now() + 5.5*3600e3).toISOString().slice(0,10);
const hhmmIST = d => new Date(d.getTime() + 5.5*3600e3).toISOString().slice(11,16);
function build(goldOz, silverOz, date, source){
  const f = factor(), g = goldOz/OZ*10, s = silverOz/OZ*1000;
  return { date, source, at: new Date(), gold_spot_10g: g, silver_spot_kg: s,
           gold_24k_10g: g*f, gold_22k_10g: g*f*P22, silver_1kg: s*f };
}
async function fetchLive(){
  try {
    const d = await getJSON('https://xaus.com/api/v1/spot?currency=INR&unit=oz');
    const gi = +d.xau.price, gu = +d.spot_usd_oz, su = +d.silver_usd_oz;
    if (gi > 0 && gu > 0 && su > 0) return build(gi, su*gi/gu, todayIST(), 'live');
  } catch(e){}
  return fetchDaily();
}
async function fetchDaily(){
  const out = {};
  for (const m of ['xau','xag']){
    let ok = false;
    for (const u of API){
      try { const d = await getJSON(u(m)); out[m] = d[m].inr; out.date = d.date; ok = true; break; } catch(e){}
    }
    if (!ok) throw new Error('live fetch failed');
  }
  return build(out.xau, out.xag, out.date, 'daily');
}

function renderCards(){
  const h = state.hist, live = state.live;
  const cur = live || h[h.length-1];
  // previous = last history row strictly before the current date
  const prev = [...h].reverse().find(r => cur && r.date < (live ? todayIST() : cur.date)) || null;
  const look = state.cfg.lookback_days || 30;
  const defs = [
    {key:'gold_24k_10g', lab:'Gold 24K', unit:'/10g', color:'var(--gold)', wide:true},
    {key:'gold_22k_10g', lab:'Gold 22K', unit:'/10g', color:'var(--gold2)'},
    {key:'silver_1kg',   lab:'Silver',   unit:'/kg',  color:'var(--silver)'},
  ];
  $('cards').innerHTML = defs.map(d => {
    const v = val(cur, d.key), p = val(prev, d.key);
    let chg = '<span class="chg flat">No previous close yet</span>';
    if (v && p){
      const c = (v-p)/p*100, cls = c < -0.005 ? 'down' : c > 0.005 ? 'up' : 'flat';
      chg = `<span class="chg ${cls}">${c>0?'▲':c<0?'▼':'•'} ${fmt(Math.abs(v-p))} (${c>0?'+':''}${c.toFixed(2)}%)</span>`;
    }
    const win = h.slice(-look).map(r => val(r,d.key)).filter(Boolean).concat(v ? [v] : []);
    const hi = win.length ? Math.max(...win) : null;
    const meta = hi && v ? `${look}d high ${fmt(hi)} · ${((v-hi)/hi*100).toFixed(1)}% from high` : '';
    return `<div class="card ${d.wide?'wide':''}">
      <span class="badge ${live&&live.source==='live'?'live':''}">${live&&live.source==='live'?'● Live':live?'Today':'Last saved'}</span>
      <div class="lab"><span class="dot" style="background:${d.color}"></span>${d.lab}</div>
      <div class="px">${fmt(v)}<span class="unit"> ${d.unit}</span></div>
      ${chg}<div class="meta">${meta}</div></div>`;
  }).join('');
  $('updated').textContent = !cur ? 'No data yet'
    : live && live.source === 'live'
      ? `Live · updated ${live.at.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',timeZone:'Asia/Kolkata'})} IST · vs yesterday's close`
      : `Saved rate · ${new Date(cur.date+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}`;
}

function renderChart(){
  const key = state.metal === 'gold' ? 'gold_24k_10g' : 'silver_1kg';
  let rows;
  if (state.days === 0){
    const last = state.hist[state.hist.length-1];
    const pts = last && last.date === todayIST() ? (last.points || []) : [];
    rows = pts.map(p => ({d:p.t, v:val(p,key)}));
    state.ticks.forEach(t => { if (!rows.length || rows[rows.length-1].d < t.t) rows.push({d:t.t, v:val(t.p,key)}); });
    rows = rows.filter(r => r.v);
  } else {
    rows = state.hist.slice(-state.days).map(r => ({d:r.date, v:val(r,key)})).filter(r => r.v);
    if (state.live && (!rows.length || rows[rows.length-1].d < state.live.date))
      rows.push({d:state.live.date, v:val(state.live,key)});
  }
  const box = $('chart');
  box.querySelectorAll('svg,.empty').forEach(n => n.remove());
  if (rows.length < 2){
    box.insertAdjacentHTML('beforeend', state.days === 0
      ? '<div class="empty">Today\'s chart builds up hour by hour.<br>Check back in a little while.</div>'
      : '<div class="empty">The chart fills in as days pass.<br>Come back after a couple of days.</div>');
    $('stats').innerHTML = ''; return;
  }
  const W = 480, H = 210, pl = 4, pr = 4, pt = 16, pb = 22;
  const vs = rows.map(r=>r.v), lo = Math.min(...vs), hi = Math.max(...vs), pad = (hi-lo)*0.08 || hi*0.01;
  const y0 = lo-pad, y1 = hi+pad;
  const X = i => pl + i*(W-pl-pr)/(rows.length-1);
  const Y = v => pt + (1-(v-y0)/(y1-y0))*(H-pt-pb);
  const col = state.metal === 'gold' ? '#e3b54a' : '#c9ced6';
  const pts = rows.map((r,i)=>`${X(i).toFixed(1)},${Y(r.v).toFixed(1)}`).join(' ');
  const iHi = vs.indexOf(hi), iLo = vs.indexOf(lo);
  const lbl = (i,v,above) => {
    const x = Math.min(Math.max(X(i), 30), W-30);
    return `<text x="${x}" y="${Y(v)+(above?-7:14)}" fill="#a59a87" font-size="11" text-anchor="middle">${short(v)}</text>`;
  };
  const dfmt = d => d.length === 5 ? d : new Date(d+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'});
  box.insertAdjacentHTML('beforeend', `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs><linearGradient id="g" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".35"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <polygon points="${X(0)},${H-pb} ${pts} ${X(rows.length-1)},${H-pb}" fill="url(#g)"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2.2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    ${lbl(iHi,hi,true)}${iLo!==iHi?lbl(iLo,lo,false):''}
    <text x="${pl}" y="${H-5}" fill="#a59a87" font-size="11">${dfmt(rows[0].d)}</text>
    <text x="${W-pr}" y="${H-5}" fill="#a59a87" font-size="11" text-anchor="end">${dfmt(rows[rows.length-1].d)}</text>
    <line id="cur" x1="0" x2="0" y1="${pt}" y2="${H-pb}" stroke="#fff5" stroke-width="1" vector-effect="non-scaling-stroke" style="display:none"/>
  </svg>`);
  const svg = box.querySelector('svg'), tip = $('tip'), curL = svg.querySelector('#cur');
  const move = e => {
    const rc = svg.getBoundingClientRect(), cx = (e.touches?e.touches[0].clientX:e.clientX) - rc.left;
    const i = Math.round(Math.min(Math.max((cx/rc.width*W - pl)/(W-pl-pr),0),1)*(rows.length-1));
    curL.setAttribute('x1',X(i)); curL.setAttribute('x2',X(i)); curL.style.display='';
    tip.style.display='block'; tip.style.left = Math.min(Math.max(X(i)/W*rc.width,60),rc.width-60)+'px';
    tip.textContent = `${dfmt(rows[i].d)} · ${fmt(rows[i].v)}`;
  };
  const end = () => { tip.style.display='none'; curL.style.display='none'; };
  svg.addEventListener('pointermove', move); svg.addEventListener('touchmove', move, {passive:true});
  svg.addEventListener('pointerleave', end); svg.addEventListener('touchend', end);
  const first = vs[0], last = vs[vs.length-1], c = (last-first)/first*100;
  $('stats').innerHTML = `
    <div class="stat"><b class="chg ${c<0?'down':'up'}">${c>0?'+':''}${c.toFixed(state.days===0?2:1)}%</b><span>${state.days===0?'Today':'Period change'}</span></div>
    <div class="stat"><b>${fmt(hi)}</b><span>High</span></div>
    <div class="stat"><b>${fmt(lo)}</b><span>Low</span></div>`;
}

function renderAlerts(){
  const items = state.hist.filter(r => r.alerts && r.alerts.length).slice(-8).reverse();
  $('alerts').innerHTML = items.length
    ? items.flatMap(r => r.alerts.slice().reverse().map(a => `<li><span class="d">${new Date(r.date+'T00:00').toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</span><span>📉 ${a}</span></li>`)).join('')
    : '<li><span style="color:var(--muted)">No falls flagged yet.</span></li>';
  const a = state.cfg.alerts || {}, look = state.cfg.lookback_days || 30;
  const desc = (m,n) => a[m] ? `<b>${n}</b>: −${a[m].daily_drop_pct}% in a day, −${a[m].drop_from_high_pct}% from ${look}-day high${a[m].below_price?`, below ${fmt(a[m].below_price)}`:''}` : '';
  $('rules').innerHTML = 'Alerts fire on: ' + [desc('gold','Gold'), desc('silver','Silver')].filter(Boolean).join(' · ');
  $('gstnote').textContent = state.cfg.include_gst
    ? ` (${state.cfg.import_duty_pct}%) + GST (${state.cfg.gst_pct}%)`
    : ` (${state.cfg.import_duty_pct ?? 15}%), excluding 3% GST`;
}

function render(){ renderCards(); renderChart(); renderAlerts(); }

async function load(){
  $('refresh').classList.add('spin');
  try { state.cfg = await getJSON('config.json'); } catch(e){}
  try { state.hist = await getJSON('history.json'); } catch(e){ state.hist = state.hist || []; }
  render();
  await refreshLive();
  $('refresh').classList.remove('spin');
}
async function refreshLive(){
  try { state.live = await fetchLive(); } catch(e){ state.live = null; }
  if (state.live && state.live.source === 'live'){
    state.ticks.push({t: hhmmIST(state.live.at), p: state.live});
    state.ticks = state.ticks.slice(-600);
  }
  render();
}
setInterval(() => { if (document.visibilityState === 'visible') refreshLive(); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') load(); });

function seg(id, attr, fn){
  $(id).addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $(id).querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    fn(b.dataset[attr]); render();
  });
}
seg('mode','mode', v => state.mode = v);
seg('metal','metal', v => state.metal = v);
seg('ranges','d', v => state.days = +v);
$('refresh').onclick = load;

let deferred;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('install').style.display='block'; });
$('install').onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; $('install').style.display='none'; };
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
</body>
</html>
